name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '/', '-'
          Set-Content -Path aurora_version.txt -Value $version -NoNewline
          python -m PyInstaller `
            --name AuroraIPTV `
            --onefile `
            --windowed `
            --icon packaging\aurora-iptv.ico `
            --clean `
            --add-data "aurora_version.txt;." `
            --add-data "vendor\stalker_studio;vendor\stalker_studio" `
            --add-data "vendor\balkan_iptv;vendor\balkan_iptv" `
            --collect-all PyQt6 `
            --hidden-import PyQt6.sip `
            main.py
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\AuroraIPTV.exe "release\Aurora-IPTV-$version-windows-x86_64.exe"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe

  build-linux:
    name: Linux AppImage deb tar
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            rpm \
            wget

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build Linux packages
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool-x86_64.AppImage
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x scripts/build_linux_artifacts.sh
          scripts/build_linux_artifacts.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/*

  release:
    name: GitHub release
    needs:
      - build-windows
      - build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
